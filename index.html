<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Docházka na stavbě</title>
<style>
  :root{
    --bg: #15171A;
    --surface: #1F2226;
    --surface-2: #2A2E33;
    --line: #383D44;
    --amber: #FFB100;
    --amber-dim: #B57E00;
    --orange: #FF5A1F;
    --text: #F3F0E8;
    --text-dim: #9AA0A6;
    --good: #5FBF7A;
    --bad: #E5636B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{ min-height:100vh; padding-bottom: 40px; }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 18px 16px 8px; }

  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; }
  header h1{ font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin:0; }
  header h1 span{ color: var(--amber); }
  .lang-switch{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:2px; }
  .lang-switch button{
    border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:700;
    padding:5px 8px; border-radius:6px; cursor:pointer;
  }
  .lang-switch button.active{ background:var(--amber); color:#1a1200; }

  nav.tabs{
    display:flex; gap:6px; background:var(--surface); border-radius:12px; padding:4px; margin-bottom:18px;
    border:1px solid var(--line);
  }
  nav.tabs button{
    flex:1; padding:10px 6px; border:none; border-radius:9px; background:transparent; color:var(--text-dim);
    font-size:13px; font-weight:700; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--amber); color:#1a1200; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
  }
  .card h2{ font-size:14px; margin:0 0 12px; color:var(--text-dim); font-weight:700; }

  label.field-label{ display:block; font-size:13px; color:var(--text-dim); margin:14px 0 8px; font-weight:600; }
  label.field-label:first-of-type{ margin-top:0; }

  select#siteSelect{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px 12px; font-size:15px; font-weight:600;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .chip.active{ background:var(--amber); border-color:var(--amber); color:#1a1200; }
  .chip.add{ border-style:dashed; color:var(--text-dim); }

  .newco{ display:flex; gap:8px; margin-top:10px; }
  .newco input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px;
  }
  .newco button{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:0 16px; border-radius:10px; font-weight:700; cursor:pointer;
  }

  .stepper{ display:flex; align-items:center; justify-content:center; gap:20px; padding:8px 0 4px; }
  .stepper button{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:24px; font-weight:700; cursor:pointer; line-height:1;
  }
  .stepper .count{ font-size:38px; font-weight:800; min-width:70px; text-align:center; font-variant-numeric: tabular-nums; }

  .save-btn{
    width:100%; margin-top:16px; background:var(--amber); color:#1a1200; border:none; border-radius:12px;
    padding:15px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .save-btn:disabled{ opacity:.4; }
  .save-toast{
    text-align:center; font-size:13px; color:var(--good); font-weight:700; margin-top:10px; min-height:16px;
  }

  .today-list{ margin-top:4px; }
  .today-list .row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .today-list .row:last-child{ border-bottom:none; }
  .today-list .row .n{ font-weight:800; color:var(--amber); }
  .empty{ color:var(--text-dim); font-size:13px; padding:6px 0; }

  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; }
  .stat .v{ font-size:22px; font-weight:800; color:var(--amber); }
  .stat .l{ font-size:11px; color:var(--text-dim); margin-top:2px; font-weight:600; }

  select.filter{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:13px; font-weight:600;
  }
  .filters{ display:flex; gap:8px; margin-bottom:14px; }
  .filters select{ flex:1; }

  .day-group{ margin-bottom:16px; }
  .day-group h3{ font-size:13px; color:var(--text-dim); font-weight:700; margin:0 0 8px; }
  .entry{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:6px; }
  .entry .co{ font-weight:700; font-size:14px; }
  .entry .site{ font-size:12px; color:var(--text-dim); margin-top:1px; }
  .entry .right{ display:flex; align-items:center; gap:10px; }
  .entry .n{ font-weight:800; color:var(--amber); font-size:16px; }
  .entry .t{ font-size:11px; color:var(--text-dim); }
  .entry .del{ background:none; border:none; color:var(--bad); font-size:16px; cursor:pointer; padding:2px 4px; }

  .qr-wrap{ display:flex; flex-direction:column; align-items:center; padding:10px 0 4px; }
  #qrcode{ background:#fff; padding:14px; border-radius:14px; margin-bottom:14px; }
  .qr-hint{ font-size:13px; color:var(--text-dim); text-align:center; line-height:1.5; }
  .url-box{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:12px; color:var(--text-dim); word-break:break-all; margin-top:14px; width:100%;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Doch<span>á</span>zka</h1>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="cs">CZ</button>
      <button data-lang="en">EN</button>
      <button data-lang="ua">UA</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="checkin" data-i18n="tabCheckin">Zápis</button>
    <button class="tab-btn" data-tab="overview" data-i18n="tabOverview">Přehled</button>
    <button class="tab-btn" data-tab="qr" data-i18n="tabQr">QR kód</button>
  </nav>

  <!-- CHECK-IN TAB -->
  <section id="tab-checkin">
    <div class="card">
      <label class="field-label" data-i18n="labelSite" style="display:none;">Stavba</label>
      <select id="siteSelect" style="display:none;"></select>
      <div id="siteNameDisplay" style="font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:4px;"></div>

      <label class="field-label" data-i18n="labelCompany">Firma</label>
      <div class="chips" id="companyChips"></div>
      <div class="newco">
        <input type="text" id="newCompanyInput" data-i18n-placeholder="newCompanyPlaceholder" placeholder="Nová firma…">
        <button id="addCompanyBtn" data-i18n="addBtn">Přidat</button>
      </div>

      <label class="field-label" data-i18n="labelCount">Počet lidí</label>
      <div class="stepper">
        <button id="minusBtn">−</button>
        <div class="count" id="countVal">0</div>
        <button id="plusBtn">+</button>
      </div>

      <button class="save-btn" id="saveBtn" data-i18n="saveBtn" disabled>Uložit</button>
      <div class="save-toast" id="saveToast"></div>
    </div>

    <div class="card">
      <h2 data-i18n="todayHeading">Dnes zapsáno na této stavbě</h2>
      <div class="today-list" id="todayList"></div>
    </div>
  </section>

  <!-- OVERVIEW TAB -->
  <section id="tab-overview" style="display:none;">
    <div class="stats-grid">
      <div class="stat"><div class="v" id="statToday">0</div><div class="l" data-i18n="statToday">lidí dnes</div></div>
      <div class="stat"><div class="v" id="statCompanies">0</div><div class="l" data-i18n="statCompanies">firem dnes</div></div>
      <div class="stat"><div class="v" id="statAvg">0</div><div class="l" data-i18n="statAvg">7denní průměr</div></div>
    </div>
    <div class="filters">
      <select class="filter" id="filterSite"></select>
      <select class="filter" id="filterCompany"></select>
    </div>
    <div id="overviewList"></div>
  </section>

  <!-- QR TAB -->
  <section id="tab-qr" style="display:none;">
    <div class="card">
      <div class="qr-wrap">
        <div id="qrcode"></div>
        <div class="qr-hint" data-i18n="qrHint">Vytiskněte a vyvěste u vstupu na stavbu. Mistr naskenuje, vybere firmu a zapíše počet lidí.</div>
        <div class="url-box" id="urlBox"></div>
      </div>
    </div>
  </section>

</div>

<script>
/* ---------- Nastavení: vložte sem URL vaší Google Apps Script webové aplikace ---------- */
/* Návod k získání URL je v souboru google-apps-script.gs.                                  */
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxBMvkN-ZO6WSe2T4Qb4tIbWfzcSB8s62DJ3zOAbaDQq7bZHPfi4794rU1KPsyYiTO4/exec";

/* ---------- Minimal offline QR code generator (no external CDN) ---------- */
/* Compact QR encoder, byte mode, error correction L, auto version 2-10 */
(function(global){
  const QRMode={BYTE:4};
  const QRErrorCorrectLevel={L:1,M:0,Q:3,H:2};
  function QR8bitByte(data){this.mode=QRMode.BYTE;this.data=data;
    this.getLength=function(){return this.data.length;};
    this.write=function(buffer){for(let i=0;i<this.data.length;i++){buffer.put(this.data.charCodeAt(i),8);}};
  }
  function QRBitBuffer(){this.buffer=[];this.length=0;
    this.get=function(index){const bufIndex=Math.floor(index/8);return((this.buffer[bufIndex]>>>(7-index%8))&1)===1;};
    this.put=function(num,length){for(let i=0;i<length;i++){this.putBit(((num>>>(length-i-1))&1)===1);}};
    this.putBit=function(bit){const bufIndex=Math.floor(this.length/8);if(this.buffer.length<=bufIndex){this.buffer.push(0);}if(bit){this.buffer[bufIndex]|=(0x80>>>(this.length%8));}this.length++;};
  }
  const QRMath=(function(){const EXP_TABLE=new Array(256),LOG_TABLE=new Array(256);
    for(let i=0;i<8;i++){EXP_TABLE[i]=1<<i;}
    for(let i=8;i<256;i++){EXP_TABLE[i]=EXP_TABLE[i-4]^EXP_TABLE[i-5]^EXP_TABLE[i-6]^EXP_TABLE[i-8];}
    for(let i=0;i<255;i++){LOG_TABLE[EXP_TABLE[i]]=i;}
    return{glog:function(n){if(n<1)throw new Error("glog("+n+")");return LOG_TABLE[n];},
      gexp:function(n){while(n<0){n+=255;}while(n>=256){n-=255;}return EXP_TABLE[n];}};
  })();
  function QRPolynomial(num,shift){if(num.length===undefined){throw new Error(num.length+"/"+shift);}
    let offset=0;while(offset<num.length&&num[offset]===0){offset++;}
    this.num=new Array(num.length-offset+shift);
    for(let i=0;i<num.length-offset;i++){this.num[i]=num[i+offset];}
    this.get=function(index){return this.num[index];};
    this.getLength=function(){return this.num.length;};
    this.multiply=function(e){const result=new Array(this.getLength()+e.getLength()-1);
      for(let i=0;i<this.getLength();i++){for(let j=0;j<e.getLength();j++){result[i+j]^=QRMath.gexp(QRMath.glog(this.get(i))+QRMath.glog(e.get(j)));}}
      return new QRPolynomial(result,0);};
    this.mod=function(e){if(this.getLength()-e.getLength()<0){return this;}
      const ratio=QRMath.glog(this.get(0))-QRMath.glog(e.get(0));
      const num=new Array(this.getLength());
      for(let i=0;i<this.getLength();i++){num[i]=this.get(i);}
      for(let i=0;i<e.getLength();i++){num[i]^=QRMath.gexp(QRMath.glog(e.get(i))+ratio);}
      return new QRPolynomial(num,0).mod(e);};
  }
  const QRRSBlock=(function(){
    const RS_BLOCK_TABLE=[
      [1,26,19],[1,26,16],[1,26,13],[1,25,9],
      [1,44,34],[1,44,28],[1,44,22],[1,44,16],
      [1,70,55],[1,70,44],[2,35,17],[2,35,13],
      [1,100,80],[2,50,32],[2,50,24],[4,25,9],
      [1,134,108],[2,67,43],[2,33,15,2,34,16],[2,33,11,2,34,12],
      [2,86,68],[4,43,27],[4,43,19],[4,43,15],
      [2,98,78],[4,49,31],[2,32,14,4,33,15],[4,39,13,1,40,14],
      [2,121,97],[2,60,38,2,61,39],[4,40,18,2,41,19],[4,40,14,2,41,15],
      [2,146,116],[3,58,36,2,59,37],[4,36,16,4,37,17],[4,36,12,4,37,13],
      [2,86,68,2,87,69],[4,69,43,1,70,44],[6,43,19,2,44,20],[6,43,15,2,44,16]
    ];
    function getRsBlockTable(typeNumber,errorCorrectLevel){
      switch(errorCorrectLevel){
        case QRErrorCorrectLevel.L:return RS_BLOCK_TABLE[(typeNumber-1)*4+0];
        case QRErrorCorrectLevel.M:return RS_BLOCK_TABLE[(typeNumber-1)*4+1];
        case QRErrorCorrectLevel.Q:return RS_BLOCK_TABLE[(typeNumber-1)*4+2];
        case QRErrorCorrectLevel.H:return RS_BLOCK_TABLE[(typeNumber-1)*4+3];
      }
    }
    function QRRSBlockCtor(totalCount,dataCount){this.totalCount=totalCount;this.dataCount=dataCount;}
    return{getRSBlocks:function(typeNumber,errorCorrectLevel){
      const rsBlock=getRsBlockTable(typeNumber,errorCorrectLevel);
      if(rsBlock===undefined){throw new Error("bad rs block @ typeNumber:"+typeNumber+"/errorCorrectLevel:"+errorCorrectLevel);}
      const length=rsBlock.length/3;const list=[];
      for(let i=0;i<length;i++){
        const count=rsBlock[i*3+0],totalCount=rsBlock[i*3+1],dataCount=rsBlock[i*3+2];
        for(let j=0;j<count;j++){list.push(new QRRSBlockCtor(totalCount,dataCount));}
      }
      return list;}};
  })();
  const QRUtil=(function(){
    const PATTERN_POSITION_TABLE=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
    const G15=(1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
    const G18=(1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
    const G15_MASK=(1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
    function getBCHDigit(data){let digit=0;while(data!==0){digit++;data>>>=1;}return digit;}
    return{
      getBCHTypeInfo:function(data){let d=data<<10;while(getBCHDigit(d)-getBCHDigit(G15)>=0){d^=(G15<<(getBCHDigit(d)-getBCHDigit(G15)));}return((data<<10)|d)^G15_MASK;},
      getBCHTypeNumber:function(data){let d=data<<12;while(getBCHDigit(d)-getBCHDigit(G18)>=0){d^=(G18<<(getBCHDigit(d)-getBCHDigit(G18)));}return(data<<12)|d;},
      getPatternPosition:function(typeNumber){return PATTERN_POSITION_TABLE[typeNumber-1];},
      getMask:function(maskPattern,i,j){
        switch(maskPattern){
          case 0:return(i+j)%2===0;
          case 1:return i%2===0;
          case 2:return j%3===0;
          case 3:return(i+j)%3===0;
          case 4:return(Math.floor(i/2)+Math.floor(j/3))%2===0;
          case 5:return(i*j)%2+(i*j)%3===0;
          case 6:return((i*j)%2+(i*j)%3)%2===0;
          case 7:return((i*j)%3+(i+j)%2)%2===0;
          default:throw new Error("bad maskPattern:"+maskPattern);
        }
      },
      getErrorCorrectPolynomial:function(errorCorrectLength){
        let a=new QRPolynomial([1],0);
        for(let i=0;i<errorCorrectLength;i++){a=a.multiply(new QRPolynomial([1,QRMath.gexp(i)],0));}
        return a;
      },
      getLengthInBits:function(mode,type){
        if(type>=1&&type<10){if(mode===QRMode.BYTE)return 8;}
        else if(type<27){if(mode===QRMode.BYTE)return 16;}
        else if(type<41){if(mode===QRMode.BYTE)return 16;}
        else{throw new Error("type:"+type);}
      },
      getLostPoint:function(qrCode){
        const moduleCount=qrCode.getModuleCount();let lostPoint=0;
        for(let row=0;row<moduleCount;row++){for(let col=0;col<moduleCount;col++){
          let sameCount=0;const dark=qrCode.isDark(row,col);
          for(let r=-1;r<=1;r++){if(row+r<0||moduleCount<=row+r)continue;
            for(let c=-1;c<=1;c++){if(col+c<0||moduleCount<=col+c)continue;if(r===0&&c===0)continue;
              if(dark===qrCode.isDark(row+r,col+c)){sameCount++;}}}
          if(sameCount>5){lostPoint+=(3+sameCount-5);}
        }}
        for(let row=0;row<moduleCount-1;row++){for(let col=0;col<moduleCount-1;col++){
          let count=0;
          if(qrCode.isDark(row,col))count++;if(qrCode.isDark(row+1,col))count++;
          if(qrCode.isDark(row,col+1))count++;if(qrCode.isDark(row+1,col+1))count++;
          if(count===0||count===4){lostPoint+=3;}
        }}
        for(let row=0;row<moduleCount;row++){for(let col=0;col<moduleCount-6;col++){
          if(qrCode.isDark(row,col)&&!qrCode.isDark(row,col+1)&&qrCode.isDark(row,col+2)&&qrCode.isDark(row,col+3)&&qrCode.isDark(row,col+4)&&!qrCode.isDark(row,col+5)&&qrCode.isDark(row,col+6)){lostPoint+=40;}
        }}
        for(let col=0;col<moduleCount;col++){for(let row=0;row<moduleCount-6;row++){
          if(qrCode.isDark(row,col)&&!qrCode.isDark(row+1,col)&&qrCode.isDark(row+2,col)&&qrCode.isDark(row+3,col)&&qrCode.isDark(row+4,col)&&!qrCode.isDark(row+5,col)&&qrCode.isDark(row+6,col)){lostPoint+=40;}
        }}
        let darkCount=0;
        for(let col=0;col<moduleCount;col++){for(let row=0;row<moduleCount;row++){if(qrCode.isDark(row,col)){darkCount++;}}}
        const ratio=Math.abs(100*darkCount/moduleCount/moduleCount-50)/5;
        lostPoint+=ratio*10;
        return lostPoint;
      }
    };
  })();
  function QRCodeModel(typeNumber,errorCorrectLevel){
    this.typeNumber=typeNumber;this.errorCorrectLevel=errorCorrectLevel;this.modules=null;this.moduleCount=0;
    this.dataCache=null;this.dataList=[];
    this.addData=function(data){this.dataList.push(new QR8bitByte(data));this.dataCache=null;};
    this.isDark=function(row,col){
      if(row<0||this.moduleCount<=row||col<0||this.moduleCount<=col){throw new Error(row+","+col);}
      return this.modules[row][col];};
    this.getModuleCount=function(){return this.moduleCount;};
    this.make=function(){this.makeImpl(false,this.getBestMaskPattern());};
    this.makeImpl=function(test,maskPattern){
      this.moduleCount=this.typeNumber*4+17;
      this.modules=new Array(this.moduleCount);
      for(let row=0;row<this.moduleCount;row++){this.modules[row]=new Array(this.moduleCount);for(let col=0;col<this.moduleCount;col++){this.modules[row][col]=null;}}
      this.setupPositionProbePattern(0,0);this.setupPositionProbePattern(this.moduleCount-7,0);this.setupPositionProbePattern(0,this.moduleCount-7);
      this.setupPositionAdjustPattern();this.setupTimingPattern();
      this.setupTypeInfo(test,maskPattern);
      if(this.typeNumber>=7){this.setupTypeNumber(test);}
      if(this.dataCache==null){this.dataCache=QRCodeModel.createData(this.typeNumber,this.errorCorrectLevel,this.dataList);}
      this.mapData(this.dataCache,maskPattern);
    };
    this.setupPositionProbePattern=function(row,col){
      for(let r=-1;r<=7;r++){if(row+r<=-1||this.moduleCount<=row+r)continue;
        for(let c=-1;c<=7;c++){if(col+c<=-1||this.moduleCount<=col+c)continue;
          if((0<=r&&r<=6&&(c===0||c===6))||(0<=c&&c<=6&&(r===0||r===6))||(2<=r&&r<=4&&2<=c&&c<=4)){this.modules[row+r][col+c]=true;}
          else{this.modules[row+r][col+c]=false;}}}
    };
    this.getBestMaskPattern=function(){let minLostPoint=0,pattern=0;
      for(let i=0;i<8;i++){this.makeImpl(true,i);const lostPoint=QRUtil.getLostPoint(this);
        if(i===0||minLostPoint>lostPoint){minLostPoint=lostPoint;pattern=i;}}
      return pattern;};
    this.setupTimingPattern=function(){
      for(let r=8;r<this.moduleCount-8;r++){if(this.modules[r][6]!=null)continue;this.modules[r][6]=(r%2===0);}
      for(let c=8;c<this.moduleCount-8;c++){if(this.modules[6][c]!=null)continue;this.modules[6][c]=(c%2===0);}
    };
    this.setupPositionAdjustPattern=function(){
      const pos=QRUtil.getPatternPosition(this.typeNumber);
      for(let i=0;i<pos.length;i++){for(let j=0;j<pos.length;j++){
        const row=pos[i],col=pos[j];if(this.modules[row][col]!=null)continue;
        for(let r=-2;r<=2;r++){for(let c=-2;c<=2;c++){
          if(r===-2||r===2||c===-2||c===2||(r===0&&c===0)){this.modules[row+r][col+c]=true;}else{this.modules[row+r][col+c]=false;}
        }}}}
    };
    this.setupTypeNumber=function(test){
      const bits=QRUtil.getBCHTypeNumber(this.typeNumber);
      for(let i=0;i<18;i++){const mod=(!test&&((bits>>i)&1)===1);this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3]=mod;}
      for(let i=0;i<18;i++){const mod=(!test&&((bits>>i)&1)===1);this.modules[i%3+this.moduleCount-8-3][Math.floor(i/3)]=mod;}
    };
    this.setupTypeInfo=function(test,maskPattern){
      const data=(this.errorCorrectLevel<<3)|maskPattern;
      const bits=QRUtil.getBCHTypeInfo(data);
      for(let i=0;i<15;i++){const mod=(!test&&((bits>>i)&1)===1);
        if(i<6){this.modules[i][8]=mod;}else if(i<8){this.modules[i+1][8]=mod;}else{this.modules[this.moduleCount-15+i][8]=mod;}}
      for(let i=0;i<15;i++){const mod=(!test&&((bits>>i)&1)===1);
        if(i<8){this.modules[8][this.moduleCount-i-1]=mod;}else if(i<9){this.modules[8][15-i-1+1]=mod;}else{this.modules[8][15-i-1]=mod;}}
      this.modules[this.moduleCount-8][8]=(!test);
    };
    this.mapData=function(data,maskPattern){
      let inc=-1,row=this.moduleCount-1,bitIndex=7,byteIndex=0;
      for(let col=this.moduleCount-1;col>0;col-=2){
        if(col===6)col--;
        while(true){
          for(let c=0;c<2;c++){
            if(this.modules[row][col-c]==null){
              let dark=false;
              if(byteIndex<data.length){dark=(((data[byteIndex]>>>bitIndex)&1)===1);}
              const mask=QRUtil.getMask(maskPattern,row,col-c);
              if(mask){dark=!dark;}
              this.modules[row][col-c]=dark;
              bitIndex--;
              if(bitIndex===-1){byteIndex++;bitIndex=7;}
            }
          }
          row+=inc;
          if(row<0||this.moduleCount<=row){row-=inc;inc=-inc;break;}
        }
      }
    };
  }
  QRCodeModel.PAD0=0xEC;QRCodeModel.PAD1=0x11;
  QRCodeModel.createData=function(typeNumber,errorCorrectLevel,dataList){
    const rsBlocks=QRRSBlock.getRSBlocks(typeNumber,errorCorrectLevel);
    const buffer=new QRBitBuffer();
    for(let i=0;i<dataList.length;i++){const data=dataList[i];
      buffer.put(data.mode,4);buffer.put(data.getLength(),QRUtil.getLengthInBits(data.mode,typeNumber));data.write(buffer);}
    let totalDataCount=0;for(let i=0;i<rsBlocks.length;i++){totalDataCount+=rsBlocks[i].dataCount;}
    if(buffer.length>totalDataCount*8){throw new Error("code length overflow.");}
    if(buffer.length+4<=totalDataCount*8){buffer.put(0,4);}
    while(buffer.length%8!==0){buffer.putBit(false);}
    while(true){
      if(buffer.length>=totalDataCount*8)break;buffer.put(QRCodeModel.PAD0,8);
      if(buffer.length>=totalDataCount*8)break;buffer.put(QRCodeModel.PAD1,8);
    }
    return QRCodeModel.createBytes(buffer,rsBlocks);
  };
  QRCodeModel.createBytes=function(buffer,rsBlocks){
    let offset=0,maxDcCount=0,maxEcCount=0;
    const dcdata=new Array(rsBlocks.length),ecdata=new Array(rsBlocks.length);
    for(let r=0;r<rsBlocks.length;r++){
      const dcCount=rsBlocks[r].dataCount,ecCount=rsBlocks[r].totalCount-dcCount;
      maxDcCount=Math.max(maxDcCount,dcCount);maxEcCount=Math.max(maxEcCount,ecCount);
      dcdata[r]=new Array(dcCount);
      for(let i=0;i<dcdata[r].length;i++){dcdata[r][i]=0xff&buffer.buffer[i+offset];}
      offset+=dcCount;
      const rsPoly=QRUtil.getErrorCorrectPolynomial(ecCount);
      const rawPoly=new QRPolynomial(dcdata[r],rsPoly.getLength()-1);
      const modPoly=rawPoly.mod(rsPoly);
      ecdata[r]=new Array(rsPoly.getLength()-1);
      for(let i=0;i<ecdata[r].length;i++){const modIndex=i+modPoly.getLength()-ecdata[r].length;ecdata[r][i]=(modIndex>=0)?modPoly.get(modIndex):0;}
    }
    let totalCodeCount=0;for(let i=0;i<rsBlocks.length;i++){totalCodeCount+=rsBlocks[i].totalCount;}
    const data=new Array(totalCodeCount);let index=0;
    for(let i=0;i<maxDcCount;i++){for(let r=0;r<rsBlocks.length;r++){if(i<dcdata[r].length){data[index++]=dcdata[r][i];}}}
    for(let i=0;i<maxEcCount;i++){for(let r=0;r<rsBlocks.length;r++){if(i<ecdata[r].length){data[index++]=ecdata[r][i];}}}
    return data;
  };
  function makeQR(text,ecLevel){
    for(let typeNumber=1;typeNumber<=10;typeNumber++){
      try{
        const qr=new QRCodeModel(typeNumber,ecLevel);
        qr.addData(text);qr.make();
        return qr;
      }catch(e){ if(typeNumber===10) throw e; }
    }
  }
  global.SimpleQR={render:function(container,text,size){
    container.innerHTML="";
    const qr=makeQR(text,QRErrorCorrectLevel.L);
    const count=qr.getModuleCount();
    const cell=Math.floor(size/count);
    const canvas=document.createElement("canvas");
    canvas.width=count*cell;canvas.height=count*cell;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#111";
    for(let row=0;row<count;row++){for(let col=0;col<count;col++){
      if(qr.isDark(row,col)){ctx.fillRect(col*cell,row*cell,cell,cell);}
    }}
    container.appendChild(canvas);
  }};
})(window);

/* ---------- State ---------- */
let lang = "cs";
let sites = ["Jordánská 3. etapa"];
let companies = [];
let selectedSite = sites[0];
let selectedCompany = null;
let count = 0;

document.getElementById("langSwitch").addEventListener("click", (e)=>{

    if(tab==="qr") renderQr();

});

/* ---------- Site select ---------- */
function renderSiteSelect(){
  const sel = document.getElementById("siteSelect");
  sel.innerHTML = "";
  sites.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    if(s===selectedSite) opt.selected = true;
    sel.appendChild(opt);
  });
  const addOpt = document.createElement("option");
  addOpt.value = "__new__"; addOpt.textContent = t("newSite");
  sel.appendChild(addOpt);

  const display = document.getElementById("siteNameDisplay");
  if(sites.length <= 1){
    display.textContent = selectedSite;
    display.style.display = "";
    sel.style.display = "none";
    document.querySelector('[data-i18n="labelSite"]').style.display = "none";
  } else {
    display.style.display = "none";
    sel.style.display = "";
    document.querySelector('[data-i18n="labelSite"]').style.display = "";
  }
}
document.getElementById("siteSelect").addEventListener("change",(e)=>{
  if(e.target.value === "__new__"){
    const name = prompt(t("newSitePrompt"));
    if(name && name.trim()){
      sites.push(name.trim());
      selectedSite = name.trim();
    }
    renderSiteSelect();
  } else {
    selectedSite = e.target.value;
  }
  renderTodayList();
  renderOverviewFilters();
});

/* ---------- Company chips ---------- */
function renderCompanyChips(){
  const wrap = document.getElementById("companyChips");
  wrap.innerHTML = "";
  companies.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (c===selectedCompany ? " active" : "");
    chip.style.display = "inline-flex";
    chip.style.alignItems = "center";
    chip.style.gap = "6px";

    const label = document.createElement("span");
    label.textContent = c;
    label.addEventListener("click", ()=>{ selectedCompany = c; renderCompanyChips(); updateSaveState(); });
    chip.appendChild(label);

    const remove = document.createElement("span");
    remove.textContent = "×";
    remove.style.opacity = "0.6";
    remove.style.fontWeight = "800";
    remove.style.cursor = "pointer";
    remove.style.padding = "0 2px";
    remove.addEventListener("click", async (ev)=>{
      ev.stopPropagation();
      const ok = confirm(t("confirmDeleteCompany").replace("{name}", c));
      if(!ok) return;
      await deleteCompany(c);
    });
    chip.appendChild(remove);

    wrap.appendChild(chip);
  });
}
async function deleteCompany(name){
  const backup = companies;
  companies = companies.filter(c=>c!==name);
  if(selectedCompany===name) selectedCompany = null;
  renderCompanyChips();
  updateSaveState();
  renderOverviewFilters();
  try{
    await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"deleteCompany", name:name })
    });
  }catch(e){
    console.error("Delete company failed", e);
    companies = backup;
    renderCompanyChips();
    renderOverviewFilters();
  }
}
document.getElementById("addCompanyBtn").addEventListener("click", async ()=>{
  const input = document.getElementById("newCompanyInput");
  const name = input.value.trim();
  if(!name) return;
  if(!companies.includes(name)) companies.push(name);
  selectedCompany = name;
  input.value = "";
  renderCompanyChips();
  updateSaveState();
  renderOverviewFilters();
  await persistCompanies(name);
});

/* ---------- Stepper ---------- */
document.getElementById("minusBtn").addEventListener("click", ()=>{ count = Math.max(0,count-1); updateCount(); });
document.getElementById("plusBtn").addEventListener("click", ()=>{ count = Math.min(999,count+1); updateCount(); });
function updateCount(){ document.getElementById("countVal").textContent = count; updateSaveState(); }
function updateSaveState(){
  document.getElementById("saveBtn").disabled = !(selectedCompany && count>0);
}

/* ---------- Save entry ---------- */
document.getElementById("saveBtn").addEventListener("click", async ()=>{
  if(!selectedCompany || count<=0) return;
  const btn = document.getElementById("saveBtn");
  if(btn.disabled) return; // guard against double-tap causing duplicate saves
  btn.disabled = true;

  const now = new Date();
  const timestamp = now.getTime();
  const tempId = "temp-" + timestamp + "-" + Math.random().toString(36).slice(2,7);
  const site = selectedSite, company = selectedCompany, savedCount = count;

  // Optimistic UI update: show the entry immediately, don't wait on the network.
  allEntries.unshift({
    id: tempId, site: site, company: company, count: savedCount,
    date: now.toISOString().slice(0,10), time: now.toTimeString().slice(0,5)
  });
  renderTodayList(); renderOverview();

  const toast = document.getElementById("saveToast");
  toast.textContent = t("savedToast") + " ✓";
  setTimeout(()=>{ toast.textContent=""; }, 2000);

  count = 0; selectedCompany = null;
  updateCount(); renderCompanyChips(); updateSaveState();
  btn.disabled = false;

  try{
    await sheetsAdd({ site: site, company: company, count: savedCount, timestamp: timestamp });
  }catch(err){
    console.error("Save failed", err);
    // Roll back the optimistic entry since it never actually saved.
    allEntries = allEntries.filter(e=>e.id!==tempId);
    renderTodayList(); renderOverview();
    toast.textContent = "⚠"; toast.style.color = "var(--bad)";
  }
});

/* ---------- Data loading (Google Sheets backend) ---------- */
let allEntries = [];

/* Simple requests only (text/plain body) to avoid CORS preflight, which
   Google Apps Script web apps don't handle. */
async function sheetsAdd(entry){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"add", site:entry.site, company:entry.company, count:entry.count, timestamp:entry.timestamp })
  });
  return res.json();
}
async function sheetsDelete(id){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"delete", id:id })
  });
  return res.json();
}
async function sheetsList(){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"list" })
  });
  return res.json();
}

async function loadAllEntries(){
  if(!SHEETS_URL || SHEETS_URL.indexOf("PASTE_YOUR")===0){
    console.warn("SHEETS_URL není nastavené — viz google-apps-script.gs");
    allEntries = [];
    return;
  }
  try{
    const data = await sheetsList();
    const rows = (data && data.rows) ? data.rows : [];
    /* The sheet only stores a numeric timestamp (to avoid Google Sheets
       auto-converting date-like text into its own Date type). Derive the
       display date/time strings here on the client instead. */
    allEntries = rows.map(r=>{
      const d = new Date(r.timestamp);
      return {
        id: r.id,
        site: r.site,
        company: r.company,
        count: r.count,
        date: isNaN(d) ? "" : d.toISOString().slice(0,10),
        time: isNaN(d) ? "" : d.toTimeString().slice(0,5)
      };
    }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  }catch(e){
    console.error("Load failed", e);
    allEntries = [];
  }
}

/* Stavby se řeší přímo v kódu appky (proměnná sites výše) — je jen jedna,
   není třeba ji synchronizovat. Firmy jsou naopak sdílené přes Google
   Sheets, aby nově přidaná firma byla vidět pro všechny, na jakémkoli
   zařízení. */
async function persistCompanies(name){
  try{
    await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"addCompany", name:name })
    });
  }catch(e){ console.error("Persist company failed", e); }
}
async function loadConfig(){
  if(!sites.includes(selectedSite)) selectedSite = sites[0];
  if(!SHEETS_URL || SHEETS_URL.indexOf("PASTE_YOUR")===0) return;
  try{
    const res = await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"listCompanies" })
    });
    const data = await res.json();
    if(data && Array.isArray(data.companies) && data.companies.length){
      companies = data.companies;
    }
  }catch(e){ console.error("Load companies failed", e); }
}

/* ---------- Today list (check-in tab) ---------- */
function renderTodayList(){
  const today = new Date().toISOString().slice(0,10);
  const list = document.getElementById("todayList");
  const rows = allEntries.filter(e=>e.date===today && e.site===selectedSite);
  if(!rows.length){ list.innerHTML = `<div class="empty">${t("emptyToday")}</div>`; return; }
  list.innerHTML = rows.map(e=>`
    <div class="row"><span>${escapeHtml(e.company)}</span><span class="n">${e.count}</span></div>
  `).join("");
}

/* ---------- Overview tab ---------- */
function renderOverviewFilters(){
  const siteSel = document.getElementById("filterSite");
  const coSel = document.getElementById("filterCompany");
  const curSite = siteSel.value || "";
  const curCo = coSel.value || "";
  siteSel.innerHTML = `<option value="">${t("allSites")}</option>` + sites.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  coSel.innerHTML = `<option value="">${t("allCompanies")}</option>` + companies.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  siteSel.value = sites.includes(curSite) ? curSite : "";
  coSel.value = companies.includes(curCo) ? curCo : "";
}
document.getElementById("filterSite").addEventListener("change", renderOverview);
document.getElementById("filterCompany").addEventListener("change", renderOverview);

function fmtDate(dateStr, l){
  const d = new Date(dateStr+"T00:00:00");
  const locale = l==="en" ? "en-GB" : l==="ua" ? "uk-UA" : "cs-CZ";
  return d.toLocaleDateString(locale, { weekday:"short", day:"numeric", month:"short" });
}
function peopleWord(n){
  if(n===1) return t("person");
  if(n>=2 && n<=4) return t("people2_4");
  return t("people5");
}

function renderOverview(){
  const today = new Date().toISOString().slice(0,10);
  const todayRows = allEntries.filter(e=>e.date===today);
  document.getElementById("statToday").textContent = todayRows.reduce((s,e)=>s+e.count,0);
  document.getElementById("statCompanies").textContent = new Set(todayRows.map(e=>e.company)).size;

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const last7 = allEntries.filter(e=>e.date>=cutoffStr);
  const byDay = {};
  last7.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.count; });
  const days = Object.keys(byDay);
  const avg = days.length ? Math.round(days.reduce((s,d)=>s+byDay[d],0)/days.length) : 0;
  document.getElementById("statAvg").textContent = avg;

  const siteFilter = document.getElementById("filterSite").value;
  const coFilter = document.getElementById("filterCompany").value;
  let rows = allEntries.slice();
  if(siteFilter) rows = rows.filter(e=>e.site===siteFilter);
  if(coFilter) rows = rows.filter(e=>e.company===coFilter);

  const byDate = {};
  rows.forEach(r=>{ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  const dates = Object.keys(byDate).sort().reverse();

  const list = document.getElementById("overviewList");
  if(!dates.length){ list.innerHTML = `<div class="empty">${t("emptyOverview")}</div>`; return; }

  list.innerHTML = dates.map(date=>{
    const entries = byDate[date];
    const dayTotal = entries.reduce((s,e)=>s+e.count,0);
    return `
      <div class="day-group">
        <h3>${fmtDate(date, lang)} · ${t("total")} ${dayTotal} ${peopleWord(dayTotal)}</h3>
        ${entries.map(e=>`
          <div class="entry">
            <div class="left">
              <div class="co">${escapeHtml(e.company)}</div>
              <div class="site">${escapeHtml(e.site)}</div>
            </div>
            <div class="right">
              <span class="n">${e.count}</span>
              <span class="t">${e.time}</span>
              <button class="del" onclick="deleteEntry('${e.id}')">✕</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
}

async function deleteEntry(id){
  const ok = confirm(t("confirmDelete"));
  if(!ok) return;
  const backup = allEntries;
  allEntries = allEntries.filter(e=>e.id!==id);
  renderTodayList(); renderOverview();
  try{
    await sheetsDelete(id);
  }catch(e){
    console.error("Delete failed", e);
    allEntries = backup;
    renderTodayList(); renderOverview();
  }
}
window.deleteEntry = deleteEntry;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------- QR tab ---------- */
function renderQr(){
  const url = window.location.href;
  document.getElementById("urlBox").textContent = url;
  const container = document.getElementById("qrcode");
  try{
    SimpleQR.render(container, url, 220);
  }catch(e){
    container.innerHTML = "<div style='color:#900;padding:10px;font-size:12px;'>QR se nepodařilo vygenerovat</div>";
    console.error(e);
  }
}

/* ---------- Init ---------- */
function mapRows(rows){
  return rows.map(r=>{
    const d = new Date(r.timestamp);
    return {
      id: r.id, site: r.site, company: r.company, count: r.count,
      date: isNaN(d) ? "" : d.toISOString().slice(0,10),
      time: isNaN(d) ? "" : d.toTimeString().slice(0,5)
    };
  }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

async function init(){
  try{
    const langPref = localStorage.getItem("lang-pref");
    if(langPref && I18N[langPref]) lang = langPref;
  }catch(e){}
  updateLangButtons();
  if(!sites.includes(selectedSite)) selectedSite = sites[0];

  // Instant paint from last-known local data (if any), so the app doesn't
  // sit empty while waiting on the network round trip to Apps Script.
  try{
    const cachedRows = localStorage.getItem("cache-rows");
    const cachedCompanies = localStorage.getItem("cache-companies");
    if(cachedRows){ allEntries = mapRows(JSON.parse(cachedRows)); }
    if(cachedCompanies){ const c = JSON.parse(cachedCompanies); if(Array.isArray(c) && c.length) companies = c; }
  }catch(e){}
  applyI18n();
  updateSaveState();

  // Then quietly fetch fresh data in the background and re-render.
  if(SHEETS_URL && SHEETS_URL.indexOf("PASTE_YOUR")!==0){
    try{
      const res = await fetch(SHEETS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"init" })
      });
      const data = await res.json();
      const rows = (data && data.rows) ? data.rows : [];
      allEntries = mapRows(rows);
      if(data && Array.isArray(data.companies) && data.companies.length){
        companies = data.companies;
      }
      try{
        localStorage.setItem("cache-rows", JSON.stringify(rows));
        localStorage.setItem("cache-companies", JSON.stringify(companies));
      }catch(e){}
      renderSiteSelect(); renderCompanyChips(); renderTodayList();
      renderOverviewFilters(); renderOverview();
      updateSaveState();
    }catch(e){ console.error("Init load failed", e); }
  }
}
init();
</script>
