<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Docházka BD Jordánská III</title>
<style>
  :root{
    --bg: #0A0D10;
    --surface: #163C5C;
    --surface-2: #1E4A6E;
    --line: #2C5878;
    --amber: #1E6EB2;
    --amber-dim: #14507F;
    --orange: #1E6EB2;
    --text: #F3F0E8;
    --text-dim: #9FB3C8;
    --good: #5FBF7A;
    --bad: #E5636B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body{ min-height:100vh; padding-bottom: 40px; }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 18px 16px 8px; }

  .logo-wrap{ display:flex; justify-content:center; padding:14px 16px; }
  .logo-card{ background:#FFFFFF; border-radius:16px; padding:16px 24px; display:flex; justify-content:center; }
  .brand-logo{ max-width:220px; width:60%; height:auto; }
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; }
  header h1{ font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin:0; line-height:1.25; color: #4FA6E8; }
  header h1 span{ color: var(--amber); }
  .lang-switch{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:2px; }
  .lang-switch button{
    border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:700;
    padding:5px 8px; border-radius:6px; cursor:pointer;
  }
  .lang-switch button.active{ background:var(--amber); color:#FFFFFF; }

  nav.tabs{
    display:flex; gap:6px; background:var(--surface); border-radius:12px; padding:4px; margin-bottom:18px;
    border:1px solid var(--line);
  }
  nav.tabs button{
    flex:1; padding:10px 6px; border:none; border-radius:9px; background:transparent; color:var(--text-dim);
    font-size:13px; font-weight:700; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--amber); color:#FFFFFF; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
  }
  .card h2{ font-size:14px; margin:0 0 12px; color:var(--text-dim); font-weight:700; }

  label.field-label{ display:block; font-size:13px; color:var(--text-dim); margin:14px 0 8px; font-weight:600; }
  label.field-label:first-of-type{ margin-top:0; }

  select#siteSelect{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px 12px; font-size:15px; font-weight:600;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .chip.active{ background:var(--amber); border-color:var(--amber); color:#FFFFFF; }
  .chip.add{ border-style:dashed; color:var(--text-dim); }

  .newco{ display:flex; gap:8px; margin-top:10px; }
  .newco input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px;
  }
  .newco button{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:0 16px; border-radius:10px; font-weight:700; cursor:pointer;
  }

  .stepper{ display:flex; align-items:center; justify-content:center; gap:20px; padding:8px 0 4px; }
  .stepper button{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:24px; font-weight:700; cursor:pointer; line-height:1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .stepper .count{ font-size:38px; font-weight:800; min-width:70px; text-align:center; font-variant-numeric: tabular-nums; }

  .save-btn{
    width:100%; margin-top:16px; background:var(--amber); color:#FFFFFF; border:none; border-radius:12px;
    padding:15px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .save-btn:disabled{ opacity:.4; }
  .save-toast{
    text-align:center; font-size:13px; color:var(--good); font-weight:700; margin-top:10px; min-height:16px;
  }

  .today-list{ margin-top:4px; }
  .today-list .row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .today-list .row:last-child{ border-bottom:none; }
  .today-list .row .n{ font-weight:800; color:var(--amber); }
  .empty{ color:var(--text-dim); font-size:13px; padding:6px 0; }

  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; }
  .stat .v{ font-size:22px; font-weight:800; color:var(--amber); }
  .stat .l{ font-size:11px; color:var(--text-dim); margin-top:2px; font-weight:600; }

  select.filter{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:13px; font-weight:600;
  }
  .filters{ display:flex; gap:8px; margin-bottom:14px; }
  .filters select{ flex:1; }

  .day-group{ margin-bottom:16px; }
  .day-group h3{ font-size:13px; color:var(--text-dim); font-weight:700; margin:0 0 8px; }
  .entry{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:6px; }
  .entry .co{ font-weight:700; font-size:14px; }
  .entry .site{ font-size:12px; color:var(--text-dim); margin-top:1px; }
  .entry .right{ display:flex; align-items:center; gap:10px; }
  .entry .n{ font-weight:800; color:var(--amber); font-size:16px; }
  .entry .t{ font-size:11px; color:var(--text-dim); }
  .entry .del{ background:none; border:none; color:var(--bad); font-size:16px; cursor:pointer; padding:2px 4px; }

  .qr-wrap{ display:flex; flex-direction:column; align-items:center; padding:10px 0 4px; }
  #qrcode{ background:#fff; padding:14px; border-radius:14px; margin-bottom:14px; }
  .qr-hint{ font-size:13px; color:var(--text-dim); text-align:center; line-height:1.5; }
  .url-box{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:12px; color:var(--text-dim); word-break:break-all; margin-top:14px; width:100%;
  }
</style>
</head>

  const display = document.getElementById("siteNameDisplay");
  if(sites.length <= 1){
    display.textContent = selectedSite;
    display.style.display = "";
    sel.style.display = "none";
    document.querySelector('[data-i18n="labelSite"]').style.display = "none";
  } else {
    display.style.display = "none";
    sel.style.display = "";
    document.querySelector('[data-i18n="labelSite"]').style.display = "";
  }
}
document.getElementById("siteSelect").addEventListener("change",(e)=>{
  if(e.target.value === "__new__"){
    const name = prompt(t("newSitePrompt"));
    if(name && name.trim()){
      sites.push(name.trim());
      selectedSite = name.trim();
    }
    renderSiteSelect();
  } else {
    selectedSite = e.target.value;
  }
  renderTodayList();
  renderOverviewFilters();
});

/* ---------- Company chips ---------- */
function renderCompanyChips(){
  const wrap = document.getElementById("companyChips");
  wrap.innerHTML = "";
  companies.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (c===selectedCompany ? " active" : "");
    chip.style.display = "inline-flex";
    chip.style.alignItems = "center";
    chip.style.gap = "6px";

    const label = document.createElement("span");
    label.textContent = c;
    label.addEventListener("click", ()=>{ selectedCompany = c; renderCompanyChips(); updateSaveState(); });
    chip.appendChild(label);

    const remove = document.createElement("span");
    remove.textContent = "×";
    remove.style.opacity = "0.6";
    remove.style.fontWeight = "800";
    remove.style.cursor = "pointer";
    remove.style.padding = "0 2px";
    remove.addEventListener("click", async (ev)=>{
      ev.stopPropagation();
      const ok = confirm(t("confirmDeleteCompany").replace("{name}", c));
      if(!ok) return;
      await deleteCompany(c);
    });
    chip.appendChild(remove);

    wrap.appendChild(chip);
  });
}
async function deleteCompany(name){
  const backup = companies;
  companies = companies.filter(c=>c!==name);
  if(selectedCompany===name) selectedCompany = null;
  renderCompanyChips();
  updateSaveState();
  renderOverviewFilters();
  try{
    await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"deleteCompany", name:name })
    });
  }catch(e){
    console.error("Delete company failed", e);
    companies = backup;
    renderCompanyChips();
    renderOverviewFilters();
  }
}
document.getElementById("addCompanyBtn").addEventListener("click", async ()=>{
  const input = document.getElementById("newCompanyInput");
  const name = input.value.trim();
  if(!name) return;
  if(!companies.includes(name)) companies.push(name);
  selectedCompany = name;
  input.value = "";
  renderCompanyChips();
  updateSaveState();
  renderOverviewFilters();
  await persistCompanies(name);
});

/* ---------- Stepper ---------- */
document.getElementById("workersMinusBtn").addEventListener("click", ()=>{ workersCount = Math.max(0,workersCount-1); updateCounts(); });
document.getElementById("workersPlusBtn").addEventListener("click", ()=>{ workersCount = Math.min(999,workersCount+1); updateCounts(); });
document.getElementById("techniciansMinusBtn").addEventListener("click", ()=>{ techniciansCount = Math.max(0,techniciansCount-1); updateCounts(); });
document.getElementById("techniciansPlusBtn").addEventListener("click", ()=>{ techniciansCount = Math.min(999,techniciansCount+1); updateCounts(); });
function updateCounts(){
  document.getElementById("workersVal").textContent = workersCount;
  document.getElementById("techniciansVal").textContent = techniciansCount;
  updateSaveState();
}
function updateSaveState(){
  document.getElementById("countsSection").style.display = selectedCompany ? "" : "none";
  document.getElementById("saveBtn").disabled = !(selectedCompany && (workersCount>0 || techniciansCount>0));
}

/* ---------- Save entry ---------- */
document.getElementById("saveBtn").addEventListener("click", async ()=>{
  if(!selectedCompany || (workersCount<=0 && techniciansCount<=0)) return;
  const btn = document.getElementById("saveBtn");
  if(btn.disabled) return; // guard against double-tap causing duplicate saves
  btn.disabled = true;

  const now = new Date();
  const timestamp = now.getTime();
  const tempId = "temp-" + timestamp + "-" + Math.random().toString(36).slice(2,7);
  const site = selectedSite, company = selectedCompany;
  const savedWorkers = workersCount, savedTechnicians = techniciansCount;
  const savedCount = savedWorkers + savedTechnicians;

  // Optimistic UI update: show the entry immediately, don't wait on the network.
  allEntries.unshift({
    id: tempId, site: site, company: company,
    workers: savedWorkers, technicians: savedTechnicians, count: savedCount,
    date: now.toISOString().slice(0,10), time: now.toTimeString().slice(0,5)
  });
  renderTodayList(); renderOverview();

  const toast = document.getElementById("saveToast");
  toast.textContent = t("savedToast") + " ✓";
  setTimeout(()=>{ toast.textContent=""; }, 2000);

  workersCount = 0; techniciansCount = 0; selectedCompany = null;
  updateCounts(); renderCompanyChips(); updateSaveState();
  btn.disabled = false;

  try{
    await sheetsAdd({ site: site, company: company, workers: savedWorkers, technicians: savedTechnicians, timestamp: timestamp });
  }catch(err){
    console.error("Save failed", err);
    // Roll back the optimistic entry since it never actually saved.
    allEntries = allEntries.filter(e=>e.id!==tempId);
    renderTodayList(); renderOverview();
    toast.textContent = "⚠"; toast.style.color = "var(--bad)";
  }
});

/* ---------- Data loading (Google Sheets backend) ---------- */
let allEntries = [];

/* Simple requests only (text/plain body) to avoid CORS preflight, which
   Google Apps Script web apps don't handle. */
async function sheetsAdd(entry){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"add", site:entry.site, company:entry.company, workers:entry.workers, technicians:entry.technicians, timestamp:entry.timestamp })
  });
  return res.json();
}
async function sheetsDelete(id){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"delete", id:id })
  });
  return res.json();
}
async function sheetsList(){
  const res = await fetch(SHEETS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"list" })
  });
  return res.json();
}

async function loadAllEntries(){
  if(!SHEETS_URL || SHEETS_URL.indexOf("PASTE_YOUR")===0){
    console.warn("SHEETS_URL není nastavené — viz google-apps-script.gs");
    allEntries = [];
    return;
  }
  try{
    const data = await sheetsList();
    const rows = (data && data.rows) ? data.rows : [];
    /* The sheet only stores a numeric timestamp (to avoid Google Sheets
       auto-converting date-like text into its own Date type). Derive the
       display date/time strings here on the client instead. */
    allEntries = rows.map(r=>{
      const d = new Date(r.timestamp);
      return {
        id: r.id,
        site: r.site,
        company: r.company,
        count: r.count,
        date: isNaN(d) ? "" : d.toISOString().slice(0,10),
        time: isNaN(d) ? "" : d.toTimeString().slice(0,5)
      };
    }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  }catch(e){
    console.error("Load failed", e);
    allEntries = [];
  }
}

/* Stavby se řeší přímo v kódu appky (proměnná sites výše) — je jen jedna,
   není třeba ji synchronizovat. Firmy jsou naopak sdílené přes Google
   Sheets, aby nově přidaná firma byla vidět pro všechny, na jakémkoli
   zařízení. */
async function persistCompanies(name){
  try{
    await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"addCompany", name:name })
    });
  }catch(e){ console.error("Persist company failed", e); }
}
async function loadConfig(){
  if(!sites.includes(selectedSite)) selectedSite = sites[0];
  if(!SHEETS_URL || SHEETS_URL.indexOf("PASTE_YOUR")===0) return;
  try{
    const res = await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"listCompanies" })
    });
    const data = await res.json();
    if(data && Array.isArray(data.companies) && data.companies.length){
      companies = data.companies;
    }
  }catch(e){ console.error("Load companies failed", e); }
}

/* ---------- Today list (check-in tab) ---------- */
function renderTodayList(){
  const today = new Date().toISOString().slice(0,10);
  const list = document.getElementById("todayList");
  const rows = allEntries.filter(e=>e.date===today && e.site===selectedSite);
  if(!rows.length){ list.innerHTML = `<div class="empty">${t("emptyToday")}</div>`; return; }
  list.innerHTML = rows.map(e=>`
    <div class="row">
      <span>${escapeHtml(e.company)}</span>
      <span class="n">${breakdownText(e)}</span>
    </div>
  `).join("");
}
function breakdownText(e){
  const parts = [];
  if(e.workers) parts.push(e.workers + " " + t("workersShort"));
  if(e.technicians) parts.push(e.technicians + " " + t("techniciansShort"));
  return parts.length ? parts.join(" · ") : e.count;
}

/* ---------- Overview tab ---------- */
function renderOverviewFilters(){
  const siteSel = document.getElementById("filterSite");
  const coSel = document.getElementById("filterCompany");
  const curSite = siteSel.value || "";
  const curCo = coSel.value || "";
  siteSel.innerHTML = `<option value="">${t("allSites")}</option>` + sites.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  coSel.innerHTML = `<option value="">${t("allCompanies")}</option>` + companies.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  siteSel.value = sites.includes(curSite) ? curSite : "";
  coSel.value = companies.includes(curCo) ? curCo : "";
}
document.getElementById("filterSite").addEventListener("change", renderOverview);
document.getElementById("filterCompany").addEventListener("change", renderOverview);

function fmtDate(dateStr, l){
  const d = new Date(dateStr+"T00:00:00");
  const locale = l==="en" ? "en-GB" : l==="ua" ? "uk-UA" : "cs-CZ";
  return d.toLocaleDateString(locale, { weekday:"short", day:"numeric", month:"short" });
}
function peopleWord(n){
  if(n===1) return t("person");
  if(n>=2 && n<=4) return t("people2_4");
  return t("people5");
}

function renderOverview(){
  const today = new Date().toISOString().slice(0,10);
  const todayRows = allEntries.filter(e=>e.date===today);
  document.getElementById("statToday").textContent = todayRows.reduce((s,e)=>s+e.count,0);
  document.getElementById("statCompanies").textContent = new Set(todayRows.map(e=>e.company)).size;

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const last7 = allEntries.filter(e=>e.date>=cutoffStr);
  const byDay = {};
  last7.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.count; });
  const days = Object.keys(byDay);
  const avg = days.length ? Math.round(days.reduce((s,d)=>s+byDay[d],0)/days.length) : 0;
  document.getElementById("statAvg").textContent = avg;

  const siteFilter = document.getElementById("filterSite").value;
  const coFilter = document.getElementById("filterCompany").value;
  let rows = allEntries.slice();
  if(siteFilter) rows = rows.filter(e=>e.site===siteFilter);
  if(coFilter) rows = rows.filter(e=>e.company===coFilter);

  const byDate = {};
  rows.forEach(r=>{ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  const dates = Object.keys(byDate).sort().reverse();

  const list = document.getElementById("overviewList");
  if(!dates.length){ list.innerHTML = `<div class="empty">${t("emptyOverview")}</div>`; return; }

  list.innerHTML = dates.map(date=>{
    const entries = byDate[date];
    const dayTotal = entries.reduce((s,e)=>s+e.count,0);
    return `
      <div class="day-group">
        <h3>${fmtDate(date, lang)} · ${t("total")} ${dayTotal} ${peopleWord(dayTotal)}</h3>
        ${entries.map(e=>`
          <div class="entry">
            <div class="left">
              <div class="co">${escapeHtml(e.company)}</div>
              <div class="site">${escapeHtml(e.site)}</div>
            </div>
            <div class="right">
              <span class="n">${breakdownText(e)}</span>
              <span class="t">${e.time}</span>
              <button class="del" onclick="deleteEntry('${e.id}')">✕</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
}

async function deleteEntry(id){
  const ok = confirm(t("confirmDelete"));
  if(!ok) return;
  const backup = allEntries;
  allEntries = allEntries.filter(e=>e.id!==id);
  renderTodayList(); renderOverview();
  try{
    await sheetsDelete(id);
  }catch(e){
    console.error("Delete failed", e);
    allEntries = backup;
    renderTodayList(); renderOverview();
  }
}
window.deleteEntry = deleteEntry;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------- QR tab ---------- */
function renderQr(){
  const url = window.location.href;
  document.getElementById("urlBox").textContent = url;
  const container = document.getElementById("qrcode");
  try{
    SimpleQR.render(container, url, 220);
  }catch(e){
    container.innerHTML = "<div style='color:#900;padding:10px;font-size:12px;'>QR se nepodařilo vygenerovat</div>";
    console.error(e);
  }
}

/* ---------- Init ---------- */
function mapRows(rows){
  return rows.map(r=>{
    const d = new Date(r.timestamp);
    const workers = Number(r.workers)||0, technicians = Number(r.technicians)||0;
    return {
      id: r.id, site: r.site, company: r.company,
      workers: workers, technicians: technicians, count: workers+technicians,
      date: isNaN(d) ? "" : d.toISOString().slice(0,10),
      time: isNaN(d) ? "" : d.toTimeString().slice(0,5)
    };
  }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

async function init(){
  try{
    const langPref = localStorage.getItem("lang-pref");
    if(langPref && I18N[langPref]) lang = langPref;
  }catch(e){}
  updateLangButtons();
  if(!sites.includes(selectedSite)) selectedSite = sites[0];

  // Instant paint from last-known local data (if any), so the app doesn't
  // sit empty while waiting on the network round trip to Apps Script.
  try{
    const cachedRows = localStorage.getItem("cache-rows");
    const cachedCompanies = localStorage.getItem("cache-companies");
    if(cachedRows){ allEntries = mapRows(JSON.parse(cachedRows)); }
    if(cachedCompanies){ const c = JSON.parse(cachedCompanies); if(Array.isArray(c) && c.length) companies = c; }
  }catch(e){}
  applyI18n();
  updateSaveState();

  // Then quietly fetch fresh data in the background and re-render.
  if(SHEETS_URL && SHEETS_URL.indexOf("PASTE_YOUR")!==0){
    try{
      const res = await fetch(SHEETS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"init" })
      });
      const data = await res.json();
      const rows = (data && data.rows) ? data.rows : [];
      allEntries = mapRows(rows);
      if(data && Array.isArray(data.companies) && data.companies.length){
        companies = data.companies;
      }
      try{
        localStorage.setItem("cache-rows", JSON.stringify(rows));
        localStorage.setItem("cache-companies", JSON.stringify(companies));
      }catch(e){}
      renderSiteSelect(); renderCompanyChips(); renderTodayList();
      renderOverviewFilters(); renderOverview();
      updateSaveState();
    }catch(e){ console.error("Init load failed", e); }
  }
}
init();
</script>
